# Weekly dependency checks, so a newly published RustSec advisory against a
# dependency nobody touched still turns something red. ci.yml's `Dependency
# checks` job runs the same `scripts/check.sh deps`, but only on push and PR.
#
# GitHub runs scheduled workflows from the default branch (`main`) only, so
# this takes effect once a release carries it there. `workflow_dispatch` runs
# it on demand from any branch.
#
# The image must stay identical to .devcontainer/devcontainer.json's
# (tests/ci_parity_guards.rs: scheduled_deps_workflow_runs_the_pinned_image).
name: Scheduled dependency checks

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deps:
    name: Dependency checks (scheduled)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/devcontainers/rust:2.0.13-1-bookworm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the pinned dependency tools
        run: scripts/install-dep-tools.sh
      - run: scripts/check.sh deps
