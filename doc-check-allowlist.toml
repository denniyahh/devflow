[[exceptions]]
kind = "source_to_docs"
token = "DEVFLOW_MONITOR_ARGV"
reason = "Test-only: carries the __monitor argv to the CLI #[cfg(test)] monitor harness entries (set by MonitorExec::HarnessEntry, test-support feature only); no release build reads it, so it is not an operator setting (Phase 50, plan 50-10)."

[[exceptions]]
kind = "source_to_docs"
token = "DEVFLOW_TEST_MONITOR_FULL"
reason = "Test-only: selects the advance-running monitor harness entry for #[cfg(test)] stage launches in the CLI own unit tests; no release build reads it, so it is not an operator setting (Phase 50, plan 50-10)."

[[exceptions]]
kind = "source_to_docs"
token = "DEVFLOW_TEST_HOLD"
reason = "Test-only: #[cfg(test)] hold points in the devflow-core monitor (50-24) and the CLI stage handoff (50-13, 50-23) wait while it names <point>:<path> and that path does not exist, so tests can land a fault in a chosen window; compiled out of release builds, so it is not an operator setting."

[[exceptions]]
kind = "source_to_docs"
token = "DEVFLOW_TEST_SKIP_WRITE_LOCK"
reason = "Test-only: under the devflow-core test-support feature, workflow::lock_for_write takes no lock while it is set, used only for the negative control that two launchers both reserve once the state write lock is skipped; compiled out of release builds, so it is not an operator setting (Phase 50.1, plan 50.1-04)."

[[exceptions]]
kind = "source_to_docs"
token = "DEVFLOW_TEST_STOPPED_OUTCOME_HOLD"
reason = "Test-only: under the devflow-core test-support feature, Supervisor::wait_agent waits while it names a path that does not exist, after a stopped agent exits and before the stopped outcome is decided, so a CLI test can order that decision against the next stage's publish; compiled out of release builds, so it is not an operator setting (Phase 50, plan 50-23)."

[[exceptions]]
kind = "source_to_docs"
token = "DEVFLOW_TEST_STREAM_WAIT_HOLD"
reason = "Test-only: under the devflow-core test-support feature, run_supervised_stage waits while it names a path that does not exist, or until a stop is requested, after a stream agent's exit is recorded and before its stream threads are waited for; compiled out of release builds, so it is not an operator setting (Phase 50, plan 50-26)."

[[exceptions]]
kind = "source_to_docs"
token = "DEVFLOW_TEST_LAUNCH_HOLD"
reason = "Test-only: #[cfg(test)] hold points in a launcher's reservation (reserve_launch) wait while it names <point>:<path> and that path does not exist, so a CLI test can observe the reservation and hold two launchers between their guard and their write; compiled out of non-test builds, so it is not an operator setting (Phase 50.1, plan 50.1-16)."

[[exceptions]]
kind = "source_to_docs"
token = "DEVFLOW_TEST_AGENT_SPAWN_HOLD"
reason = "Test-only: under the devflow-core test-support feature, run_supervised_stage waits while it names <stage>:<path> for its stage and that path does not exist, after it adopts its liveness lock and before it spawns its agent, so 50.1-16 and 50.1-17 fixtures can hold a pending supervisor with no agent and no socket; compiled out of release builds, so it is not an operator setting (Phase 50.1, plan 50.1-16)."

[[exceptions]]
kind = "source_to_docs"
token = "DEVFLOW_TEST_WITHHOLD_PUBLISH_PROBE"
reason = "Test-only: under the devflow-core test-support feature, spawn_monitor's one publish wait treats every probe of the new supervisor as unanswered while it names <agent>:<stage> for the launch being spawned, so the Phase 51 SUPV-01 experiment can withhold one launch's publish (a failover relaunch, or an ordinary Code launch) and watch the real expiry path; compiled out of release builds, so it is not an operator setting (Phase 51, plan 51-10)."

[[exceptions]]
kind = "source_to_docs"
token = "DEVFLOW_TEST_WITHHOLD_SUCCESSOR_PROBE"
reason = "Test-only: a #[cfg(test)] seam in the CLI's publish_record answers the post-save successor probe Gone, without probing, while it names <agent>:<stage>:<marker-path> for the launch being published, and writes the marker, so the Phase 51 SUPV-01 experiment can watch the run be recorded stopped while its successor still runs; compiled out of release builds, so it is not an operator setting (Phase 51, plan 51-13)."

[[exceptions]]
kind = "source_to_docs"
token = "DEVFLOW_TEST_GSD_HOME"
reason = "Test-only: the CLI #[cfg(test)] build reads GSD's verification status under the stub home a unit test passes to its child process (and the supervisors it spawns) through this variable, so no unit test reaches a real GSD install; a release build reads HOME and never this variable, so it is not an operator setting (Phase 52, plan 52-22)."
