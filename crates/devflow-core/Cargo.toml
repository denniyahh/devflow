[package]
name = "devflow-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Opinionated AI-driven development workflow state machine"

[features]
# Exposes `test_support` (hermetic git command construction, 999.37) to other
# crates' test targets. Off by default — it adds no runtime behavior and is
# never enabled for a normal build.
test-support = []

[dependencies]
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
semver = "1"
git-conventional = "1"

[dev-dependencies]
tempfile = "3"
# This crate's own integration tests (`tests/monitor_e2e.rs`,
# `tests/devflow_dir_gitignore.rs`) use `test_support`. A package-scoped build
# such as `cargo clippy -p devflow-core --all-targets` does not unify features
# with devflow-cli's dev-dependency, so enable the feature for them here.
devflow-core = { path = ".", features = ["test-support"] }
# `insta::assert_snapshot!` for the prompt-text drift guard (47-CONTEXT.md D-14/D-15).
insta = { workspace = true }
