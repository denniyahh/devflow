# NEGATIVE CONTROL: codex's demonstrated bypass (46-REVIEWS.md C-02).
#
# The `sequential` job carries the required NAME and nothing else. A second,
# differently-keyed job supplies the ci-cpus.sh source line and the pinned
# suite line. A whole-file search finds all three tokens and passes; a
# job-scoped recogniser must not.
name: Fixture CI

on:
  push:
  pull_request:
    branches: [main, develop]

jobs:
  sequential:
    name: Sequential 2-CPU check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

  decoy:
    name: Decoy job that carries the pin the sequential job lacks
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: |
          set -euo pipefail
          . scripts/lib/ci-cpus.sh
          cpu_pin_prefix
          "${CPU_PIN[@]}" scripts/check.sh all
